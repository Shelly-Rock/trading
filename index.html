<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Trading Chart - BTCUSD & XAUUSD</title>
    <script src="lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">MT5 Trading</h1>
            </div>
            <div class="header-center">
                <div class="symbol-selector">
                    <button id="btnBTC" class="symbol-tab active" data-symbol="BTCUSD">
                        <span class="symbol-icon">₿</span>
                        <span>BTC/USD</span>
                    </button>
                    <button id="btnXAU" class="symbol-tab" data-symbol="XAUUSD">
                        <span class="symbol-icon"> Au</span>
                        <span>XAU/USD</span>
                    </button>
                </div>
            </div>
            <div class="header-right">
                <span id="currentPrice" class="current-price">--</span>
                <span id="priceChange" class="price-change">--</span>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-group">
                <label>Data Source:</label>
                <select id="dataSource">
                    <option value="binance">Binance</option>
                    <option value="mt5">MT5 WebTerminal</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label>Chart Type:</label>
                <select id="chartType">
                    <option value="candlestick" selected>Candlestick</option>
                    <option value="bar">Bar</option>
                    <option value="line">Line</option>
                    <option value="area">Area</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label>Timeframe:</label>
                <select id="timeframe">
                    <option value="1m">1 Phut</option>
                    <option value="5m">5 Phut</option>
                    <option value="15m">15 Phut</option>
                    <option value="1h" selected>1 Gio</option>
                    <option value="4h">4 Gio</option>
                    <option value="1d">1 Ngay</option>
                    <option value="1w">1 Tuan</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label>Indicators:</label>
                <button id="toggleVolume" class="btn btn-secondary active">Volume</button>
                <button id="toggleMA" class="btn btn-secondary">MA 20</button>
            </div>
            <div class="toolbar-group indicators-list" id="activeIndicators"></div>
        </div>

        <div class="main-content">
            <div class="chart-container">
                <div id="binanceChart" class="chart"></div>
                <div id="mt5Chart" class="mt5-iframe-container" style="display: none;">
                    <iframe id="mt5iframe" src="" width="100%" height="100%" frameborder="0"></iframe>
                </div>
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Dang tai du lieu...</p>
                </div>
                <div id="priceTimeLabel" class="price-time-label" style="display: none;"></div>
            </div>
            <div class="chart-info">
                <div class="info-panel">
                    <div class="info-header">
                        <span id="infoSymbol">BTCUSD</span>
                        <span id="infoExchange">Binance</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Open:</span>
                        <span id="infoOpen">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">High:</span>
                        <span id="infoHigh">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Low:</span>
                        <span id="infoLow">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Close:</span>
                        <span id="infoClose">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Time:</span>
                        <span id="infoTime">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Volume:</span>
                        <span id="infoVolume">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Price:</span>
                        <span id="priceValue">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Timeframe:</span>
                        <span id="timeValue">--</span>
                    </div>
                </div>
                <div class="countdown-panel">
                    <div class="countdown-label">Next Candle</div>
                    <div id="infoCountdown" class="countdown-value">--:--</div>
                    <div id="countdownBar" class="countdown-bar"></div>
                </div>
                <div class="live-price-panel">
                    <div id="livePriceLabel" class="live-label">Live Price</div>
                    <div id="livePriceValue" class="live-value">--</div>
                    <div id="liveCountdown" class="live-countdown">--</div>
                </div>
            </div>
            <div class="sidebar">
                <div class="sidebar-section">
                    <h3>MA Settings</h3>
                    <div class="ma-settings">
                        <div class="ma-input-group">
                            <label>MA Period:</label>
                            <input type="number" id="maPeriod" value="20" min="1" max="200">
                        </div>
                        <div class="ma-input-group">
                            <label>MA Color:</label>
                            <input type="color" id="maColor" value="#f7931a">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>BTC: CoinGecko API</span>
            <span>XAU: OANDA / Yahoo Finance</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
